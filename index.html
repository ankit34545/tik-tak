<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="container">
        <header>
            <h1>Tic Tac Toe</h1>
            
            <div class="player-setup">
                <input type="text" id="player1-name" class="input-css" value="Player 1" placeholder="Name (X)">
                <span class="vs">VS</span>
                <input type="text" id="player2-name" class="input-css" value="Player 2" placeholder="Name (O)">
            </div>

            <div class="settings">
                <div class="setting-group">
                    <label for="game-mode">Mode:</label>
                    <select id="game-mode" class="select-css">
                        <option value="pvp">1v1 (Player vs Player)</option>
                        <option value="cpu">1vCPU (Player vs Computer)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="grid-size">Grid Size:</label>
                    <select id="grid-size" class="select-css">
                        <option value="3">3 x 3</option>
                        <option value="4">4 x 4</option>
                        <option value="5">5 x 5</option>
                        <option value="6">6 x 6</option>
                    </select>
                </div>
            </div>
            <div class="status" id="status">Player X's Turn</div>
        </header>

        <div class="game-board" id="board">
            <!-- Cells will be generated here by JavaScript -->
        </div>

        <div class="controls">
            <button id="reset-btn" class="btn primary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                Restart Game
            </button>
            <button id="reset-scores-btn" class="btn secondary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                </svg>
                Clear Records
            </button>
        </div>

        <div class="scores">
            <div class="score-card player-x active">
                <span class="label" id="label-x">Player 1</span>
                <span class="score" id="score-x">0</span>
            </div>
            <div class="score-card ties">
                <span class="label">Ties</span>
                <span class="score" id="score-ties">0</span>
            </div>
            <div class="score-card player-o">
                <span class="label" id="label-o">Player 2</span>
                <span class="score" id="score-o">0</span>
            </div>
        </div>
    </main>

    <!-- Winner Modal -->
    <div class="modal-overlay" id="winner-modal">
        <div class="modal-content">
            <h2 id="modal-title">Player Wins!</h2>
            <div class="modal-trophy">🏆</div>
            <button id="modal-close-btn" class="btn primary-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
